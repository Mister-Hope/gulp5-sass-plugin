name: Unit Test

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  linter-and-unit:
    name: Unit test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - ^22.23.4
          - ^24.22.1
          - ^26.13.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - name: Build project
        run: pnpm run build

      - name: Unit test and save results
        env:
          TEST_REPORT: ${{ matrix.node-version == '^26.13.0' && 'true' || '' }}
        run: pnpm run test

      - name: Upload test results
        if: ${{ !cancelled() && matrix.node-version == '^26.13.0' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/test-report.junit.xml
          report_type: test_results

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.node-version == '^26.13.0' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/cobertura-coverage.xml
